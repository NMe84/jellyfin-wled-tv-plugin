name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write   # required to upload assets and push to gh-pages

env:
  DLL: Jellyfin.Plugin.WledTv
  GUID: a4b5c6d7-e8f9-4a3b-8c7d-e6f5a4b3c2d1

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # build.yaml carries a 3-part base (e.g. 2.1.0).  The 4th component encodes
      # the Jellyfin major version the build targets: <base>.10 / <base>.12.
      - name: Extract base version from build.yaml
        id: ver
        run: |
          BASE=$(grep '^version:' build.yaml | grep -oP '"[^"]+"' | tr -d '"')
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "Base version: $BASE  ->  ${BASE}.10 (Jellyfin 10.x), ${BASE}.12 (Jellyfin 12)"

      - name: Build and package both variants
        run: |
          set -euo pipefail
          BASE="${{ steps.ver.outputs.base }}"
          mkdir -p dist
          build() {
            jf="$1"; tfm="$2"; suffix="$3"; ver="$4"
            echo "::group::Jellyfin $jf ($tfm) -> $ver"
            dotnet build --configuration Release -p:JellyfinVersion="$jf" \
              -p:Version="$ver" -p:AssemblyVersion="$ver" -p:FileVersion="$ver"
            (cd "bin/Release/$tfm" && zip -q "$GITHUB_WORKSPACE/dist/${DLL}-${suffix}.zip" "${DLL}.dll")
            (cd dist && md5sum "${DLL}-${suffix}.zip" | awk '{print $1}' > "${DLL}-${suffix}.zip.md5")
            echo "::endgroup::"
          }
          build 10.11.10 net9.0  jf10 "${BASE}.10"
          build 12.0.0   net10.0 jf12 "${BASE}.12"
          ls -l dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/* build.yaml --clobber

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Update manifest (one entry per Jellyfin ABI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.ver.outputs.base }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CHANGELOG="$(gh release view "$TAG" --json body --jq .body)"
          export CHANGELOG
          export PNAME="$(grep '^name:' build.yaml | sed 's/^name:[[:space:]]*//; s/^"//; s/"$//')"
          export PDESC="$(grep '^description:' build.yaml | sed 's/^description:[[:space:]]*//; s/^"//; s/"$//')"
          export POWNER="$(grep '^owner:' build.yaml | sed 's/^owner:[[:space:]]*//; s/^"//; s/"$//')"
          export PCATEGORY="$(grep '^category:' build.yaml | sed 's/^category:[[:space:]]*//; s/^"//; s/"$//')"
          export PIMAGE="$(grep '^imageUrl:' build.yaml | sed 's/^imageUrl:[[:space:]]*//; s/^"//; s/"$//')"
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib

          base      = os.environ["BASE"]
          tag       = os.environ["TAG"]
          repo      = os.environ["REPO"]
          guid      = os.environ["GUID"]
          dll       = os.environ["DLL"]
          changelog = os.environ.get("CHANGELOG", "") or ""

          # The 4th version component is the Jellyfin major version this build
          # targets.  Jellyfin's auto-updater only offers a version STRICTLY
          # greater than the installed one, so giving the newer Jellyfin a higher
          # number makes a 10.x -> 12 server upgrade a real update (otherwise the
          # stale .NET 9 build would be kept and fail to load).  Newest ABI first.
          targets = [
              ("12.0.0.0",  f"{dll}-jf12.zip", f"{base}.12"),
              ("10.11.9.0", f"{dll}-jf10.zip", f"{base}.10"),
          ]

          man = pathlib.Path("pages/manifest.json")
          data = json.loads(man.read_text()) if man.exists() else []

          entry = next((p for p in data if str(p.get("guid", "")).lower() == guid.lower()), None)
          if entry is None:
              entry = {
                  "category": os.environ.get("PCATEGORY", ""),
                  "description": os.environ.get("PDESC", ""),
                  "guid": guid,
                  "imageUrl": os.environ.get("PIMAGE", ""),
                  "name": os.environ.get("PNAME", ""),
                  "overview": os.environ.get("PDESC", ""),
                  "owner": os.environ.get("POWNER", ""),
                  "versions": [],
              }
              data.append(entry)

          ts = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          new_versions = {v for _, _, v in targets}
          kept = [v for v in entry.get("versions", []) if v.get("version") not in new_versions]

          rows = []
          for abi, asset, version in targets:
              digest = hashlib.md5(pathlib.Path("dist", asset).read_bytes()).hexdigest()
              rows.append({
                  "changelog": changelog,
                  "checksum": digest,
                  "sourceUrl": f"https://github.com/{repo}/releases/download/{tag}/{asset}",
                  "targetAbi": abi,
                  "timestamp": ts,
                  "version": version,
              })

          entry["versions"] = rows + kept
          man.write_text(json.dumps(data, indent=2) + "\n")
          for r in rows:
              print(f"added {r['version']} abi={r['targetAbi']} -> {r['sourceUrl']}")
          PY

      - name: Commit manifest
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Add ${{ steps.ver.outputs.base }}.10 / ${{ steps.ver.outputs.base }}.12"
          git push

      - name: Trigger jellyfin-plugins aggregator
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MANIFEST_REPO_PAT }}
          repository: NMe84/jellyfin-plugins
          event-type: plugin-released
