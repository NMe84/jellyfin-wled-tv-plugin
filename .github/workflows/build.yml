name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Jellyfin 10.11 (net9.0)"
            jellyfin: "10.11.10"
          - label: "Jellyfin 12 (net10.0)"
            jellyfin: "12.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # No --no-restore: each variant restores its own Jellyfin package versions.
      - name: Build
        run: dotnet build --configuration Release -p:JellyfinVersion=${{ matrix.jellyfin }}
