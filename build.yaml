description: "Drive a WLED LED strip from video content playing in Jellyfin"
overview: >
  Server-side edge lighting for WLED. Jellyfin decodes the playing video with its
  bundled ffmpeg (hardware-accelerated, HDR tone-mapped), samples the edges of each
  frame, and streams the colours to a WLED strip in real time. No browser
  involvement, so it works on any client, including smart-TV apps.
