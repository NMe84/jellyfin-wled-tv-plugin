# "version" above is a 3-part BASE. One tag ships a build per Jellyfin major,
# and the 4th version component encodes which one (so a 10.x -> 12 server
# upgrade is a real version bump and auto-updates):
#   Jellyfin 10.x -> net9.0,  targetAbi 10.11.9.0, version <base>.10, *-jf10.zip
#   Jellyfin 12   -> net10.0, targetAbi 12.0.0.0,  version <base>.12, *-jf12.zip
# The targetAbi/framework fields below describe the 10.x build only.
targetAbi: "10.11.9.0"
framework: "net9.0"
description: "Drive a WLED LED strip from video content playing in Jellyfin"
overview: >
  Server-side edge lighting for WLED. Jellyfin decodes the playing video with its
  bundled ffmpeg (hardware-accelerated, HDR tone-mapped), samples the edges of each
  frame, and streams the colours to a WLED strip in real time. No browser
  involvement, so it works on any client, including smart-TV apps.
owner: "nme84"
category: "General"
imageUrl: "https://raw.githubusercontent.com/NMe84/jellyfin-wled-tv-plugin/master/wledtv.png"
